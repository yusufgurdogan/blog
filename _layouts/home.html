---
layout: default
---

<div class="catalogue">
  {% assign posts_by_year = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
  {% for year in posts_by_year %}
    <div class="catalogue-year">
      <div class="catalogue-year-label">{{ year.name }}</div>
      <div class="catalogue-list">
        {% for post in year.items %}
          <a href="{{ post.url | relative_url }}" class="catalogue-item">
            <h2 class="catalogue-title">{{ post.title }}</h2>
            <time datetime="{{ post.date | date_to_xmlschema }}" class="catalogue-time">{{ post.date | date: "%b %d" }}</time>
          </a>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</div>
