# Site settings
title:          Yusuf Gürdoğan
description:    "Personal blog of Yusuf Gürdoğan"
url:            "https://yusufgurdogan.com"
lang:           en

# Google Analytics (leave empty to disable)
google_analytics:

# Author
author:
  name:         Yusuf Gürdoğan
  url:          https://yusufgurdogan.com

# Social links (footer icons)
social:
  github:       https://github.com/yusufgurdogan
  x:            https://x.com/YusufGurdogan

# Share cards (jekyll-seo-tag)
twitter:
  username:     YusufGurdogan
  card:         summary_large_image
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og/default.png

# Build settings
markdown:       kramdown
remote_theme:   chesterhow/tale
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# Permalinks
permalink:      /:year-:month-:day/:title

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

# Disqus shortname (only used on posts with `comments: true`)
disqus:
